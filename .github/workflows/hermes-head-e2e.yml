name: hermes-native-head-three-repo-e2e
on:
  pull_request:
    paths:
      - 'tests/test_hermes_head_e2e.py'
      - 'runner_riddle/hermes_head_observation.py'
      - 'runner_riddle/native_head_guest.py'
      - 'runner_riddle/head_bank_handoff.py'
      - 'runner_riddle/hermes_leases.py'
      - '.github/workflows/hermes-head-e2e.yml'
  push:
    paths:
      - 'tests/test_hermes_head_e2e.py'
      - 'runner_riddle/hermes_head_observation.py'
      - 'runner_riddle/native_head_guest.py'
      - 'runner_riddle/head_bank_handoff.py'
      - 'runner_riddle/hermes_leases.py'
      - '.github/workflows/hermes-head-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-guest-chart-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          path: router
      - uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: ddb6297a6c62d4bdee673ba3971129ec2dc73446
          path: nan0s
      - uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNLMind_HERMES
          ref: a01148eb5653729e322fae5b8b0112d3848dffd7
          path: hermes
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile pinned class-preserving NaN16 raw-word VM
        run: |
          cd nan0s/aarch64/android
          cc -std=gnu99 -O2 -fPIC -shared -ffp-contract=off -fno-fast-math \
            core/nan16.c core/nan_dev.c core/nan_load.c \
            core/nan_render.c core/nan_state.c core/nan_net_driver.c \
            -o ../../libnan_head.so -lm
      - name: Assemble real NaN16 worker and stable entry labels
        run: |
          cd nan0s
          LC_ALL=C awk -f tools/nmk.awk -v CMD=emit \
            -v LABELS="$GITHUB_WORKSPACE/nan0s/head.labels" \
            src/nannet/n16_head_worker.nas > "$GITHUB_WORKSPACE/nan0s/head.nan"
          test -s head.nan
          test -s head.labels
      - name: Execute real three-repository lease-to-checkpoint regression
        working-directory: router
        env:
          PYTHONPATH: ${{ github.workspace }}/router:${{ github.workspace }}/hermes
          HERMES_CHECKPOINT_E2E: '1'
          NAN_HEAD_GUEST_LIBRARY: ${{ github.workspace }}/nan0s/libnan_head.so
          NAN_HEAD_GUEST_IMAGE: ${{ github.workspace }}/nan0s/head.nan
          NAN_HEAD_GUEST_LABELS: ${{ github.workspace }}/nan0s/head.labels
        run: python -m unittest discover -s tests -p 'test_hermes_head_e2e.py' -v
