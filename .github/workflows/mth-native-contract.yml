name: mth-native-contract

on:
  push:
    branches: [main, 'mth-*', mth-graph-spectral-foundation, mth-sparse-graph-laplacian, mth-weighted-csr-v2, mth-sparse-laplacian-three-files, mth-k256-pair-space-v1-rebased]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k256-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NaNROUTER
        uses: actions/checkout@v4

      - name: Checkout canonical NaN0S toolchain
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: math-contract-registry
          path: nan0s

      - name: Build NaN0S execution harness
        run: make -s -C nan0s/aarch64/android nan_cli

      - name: Verify page-backed K16 and full-U guest bridge
        run: python -m unittest discover -s tests -p 'test_mth_pair_nan0s_guest_native.py' -v

      - name: Assemble K256 fixture with NaN16 source assembler
        run: |
          mkdir -p build/mth
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_k256_laplacian_test.nas > build/mth/k256.nan

      - name: Execute K256 fixture
        run: |
          nan0s/aarch64/android/nan_cli --img build/mth/k256.nan --steps 2000000 --serial > build/mth/k256.out 2> build/mth/k256.err
          cat build/mth/k256.out
          cat build/mth/k256.err
          grep -q '^MTH K256 LAPLACIAN PASS' build/mth/k256.out

      - name: Assemble K255 fixture with NaN16 source assembler
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_k255_laplacian_test.nas > build/mth/k255.nan

      - name: Execute K255 fixture
        run: |
          nan0s/aarch64/android/nan_cli --img build/mth/k255.nan --steps 4000000 --serial > build/mth/k255.out 2> build/mth/k255.err
          cat build/mth/k255.out
          cat build/mth/k255.err
          grep -q '^MTH K255 LAPLACIAN PASS' build/mth/k255.out

      - name: Assemble C255 ring fixture with NaN16 source assembler
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_ring255_laplacian_test.nas > build/mth/ring255.nan

      - name: Execute C255 ring fixture
