name: mth-native-contract

on:
  push:
    branches: [mth-graph-spectral-foundation, mth-sparse-graph-laplacian, mth-weighted-csr-v2, mth-sparse-laplacian-three-files, mth-components-nullity-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k256-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NaNROUTER
        uses: actions/checkout@v4

      - name: Checkout canonical NaN0S toolchain
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: main
          path: nan0s

      - name: Build NaN0S execution harness
        run: make -s -C nan0s/aarch64/android nan_cli

      - name: Assemble K256 fixture with NaN16 source assembler
        run: |
          mkdir -p build/mth
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_k256_laplacian_test.nas > build/mth/k256.nan

      - name: Execute K256 fixture
        run: |
          nan0s/aarch64/android/nan_cli --img build/mth/k256.nan --steps 2000000 --serial > build/mth/k256.out 2> build/mth/k256.err
          cat build/mth/k256.out
          cat build/mth/k256.err
          grep -q '^MTH K256 LAPLACIAN PASS' build/mth/k256.out

      - name: Assemble sparse graph fixture with NaN16 source assembler
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_sparse_graph_laplacian_test.nas > build/mth/sparse.nan

      - name: Execute sparse graph fixture
        run: |
          nan0s/aarch64/android/nan_cli --img build/mth/sparse.nan --steps 4000000 --serial > build/mth/sparse.out 2> build/mth/sparse.err
          cat build/mth/sparse.out
          cat build/mth/sparse.err
          grep -q '^MTH SPARSE GRAPH LAPLACIAN PASS' build/mth/sparse.out

      - name: Assemble weighted sparse graph fixture with NaN16 source assembler
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_sparse_weighted_graph_laplacian_v2_test.nas > build/mth/weighted-sparse.nan

      - name: Execute weighted sparse graph fixture
        run: |
          nan0s/aarch64/android/nan_cli --img build/mth/weighted-sparse.nan --steps 8000000 --serial > build/mth/weighted-sparse.out 2> build/mth/weighted-sparse.err
          cat build/mth/weighted-sparse.out
          cat build/mth/weighted-sparse.err
          grep -q '^MTH WEIGHTED CSR LAPLACIAN V2 PASS' build/mth/weighted-sparse.out

      - name: Assemble graph components/nullity fixture with NaN16 source assembler
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_graph_components_nullity_v1_test.nas > build/mth/components-nullity.nan

      - name: Execute graph components/nullity fixture
        run: |
          nan0s/aarch64/android/nan_cli --img build/mth/components-nullity.nan --steps 12000000 --serial > build/mth/components-nullity.out 2> build/mth/components-nullity.err
          cat build/mth/components-nullity.out
          cat build/mth/components-nullity.err
          grep -q '^ABCDMTH GRAPH COMPONENTS NULLITY V1 PASS' build/mth/components-nullity.out
