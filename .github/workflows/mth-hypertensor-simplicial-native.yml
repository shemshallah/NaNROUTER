name: mth-hypertensor-simplicial-native

on:
  pull_request:
    paths:
      - 'mth/nan16/mth_hypertensor16_f32.nas'
      - 'mth/nan16/mth_simplicial_motif3.nas'
      - 'mth/nan16/mth_triangle_hodge3_f32.nas'
      - 'mth/nan16/mth_poincare_pair2_f32.nas'
      - 'mth/nan16/mth_simplicial_wavelet3_f32.nas'
      - 'mth/tests/mth_hypertensor_simplicial_native_test.nas'
      - 'mth/tests/mth_global_simplicial_focus_native_test.nas'
      - 'mth/nan16/mth_global_focus16_f32.nas'
      - 'mth/nan16/mth_graph_wavelet16_f32.nas'
      - 'mth/nan16/mth_hyperbolic_sheaf16_f32.nas'
      - 'mth/nan16/mth_graph_fourier16_f32.nas'
      - 'mth/tests/mth_hyperbolic_sheaf_fourier_native_test.nas'
      - 'mth/nan16/mth_global_motif_reduce16.nas'
      - 'mth/nan16/mth_spectral_cut16_f32.nas'
      - 'mth/tests/mth_global_motif_spectral_native_test.nas'
      - 'mth/tests/mth_connected_hypertensor_focus_native_test.nas'
      - 'mth/nan16/mth_hypertensor16_backward_f32.nas'
      - 'mth/tests/mth_hypertensor_backward_native_test.nas'
      - 'mth/nan16/mth_fiedler16_f32.nas'
      - 'mth/tests/mth_fiedler16_native_test.nas'
      - 'mth/nan16/mth_global_focus16_backward_f32.nas'
      - 'mth/tests/mth_global_focus16_backward_native_test.nas'
      - 'mth/nan16/mth_global_hodge256_f32.nas'
      - 'mth/tests/mth_global_hodge256_native_test.nas'
      - '.github/workflows/mth-hypertensor-simplicial-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nan16-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout NaNROUTER
        uses: actions/checkout@v4
      - name: Checkout pinned NaN0S canonical toolchain
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: fe636177027a1ede3f19939f7627e660e7bef5f3
          path: nan0s
      - name: Build canonical NaN16 CLI
        run: make -s -C nan0s/aarch64/android nan_cli
      - name: Assemble native guest fixture
        run: |
          mkdir -p build/mth
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_hypertensor_simplicial_native_test.nas > build/mth/hypertriad.nan
      - name: Execute native NaN16 arithmetic and checks
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/hypertriad.nan --steps 15000000 --serial > build/mth/hypertriad.out 2> build/mth/hypertriad.err
          cat build/mth/hypertriad.out
          cat build/mth/hypertriad.err
          grep -q '^MTH HYPERTENSOR SIMPLICIAL PASS' build/mth/hypertriad.out
      - name: Assemble global native focal and graph-wavelet fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_global_simplicial_focus_native_test.nas > build/mth/global-focus.nan
      - name: Execute native focal and graph wavelet
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/global-focus.nan --steps 15000000 --serial > build/mth/global-focus.out 2> build/mth/global-focus.err
          cat build/mth/global-focus.out
          cat build/mth/global-focus.err
          grep -q '^MTH GLOBAL SIMPLICIAL FOCUS PASS' build/mth/global-focus.out
      - name: Assemble sheaf and graph Fourier native fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_hyperbolic_sheaf_fourier_native_test.nas > build/mth/sheaf-fourier.nan
      - name: Execute sheaf and graph Fourier in NaN16
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/sheaf-fourier.nan --steps 15000000 --serial > build/mth/sheaf-fourier.out 2> build/mth/sheaf-fourier.err
          cat build/mth/sheaf-fourier.out
          cat build/mth/sheaf-fourier.err
          grep -q '^MTH HYPERBOLIC SHEAF FOURIER PASS' build/mth/sheaf-fourier.out
      - name: Assemble global motif and spectral cut native fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_global_motif_spectral_native_test.nas > build/mth/motif-spectral.nan
      - name: Execute global motif and spectral cut in NaN16
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/motif-spectral.nan --steps 15000000 --serial > build/mth/motif-spectral.out 2> build/mth/motif-spectral.err
          cat build/mth/motif-spectral.out
          cat build/mth/motif-spectral.err
          grep -q '^MTH GLOBAL HOT COLD SPECTRAL PASS' build/mth/motif-spectral.out
      - name: Assemble connected hyperbolic hypertensor native fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_connected_hypertensor_focus_native_test.nas > build/mth/connected-focus.nan
      - name: Execute connected hyperbolic-to-global NaN16 path
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/connected-focus.nan --steps 15000000 --serial > build/mth/connected-focus.out 2> build/mth/connected-focus.err
          cat build/mth/connected-focus.out
          cat build/mth/connected-focus.err
          grep -q '^MTH CONNECTED HYPERTENSOR FOCUS PASS' build/mth/connected-focus.out
      - name: Assemble hypertensor backward native fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_hypertensor_backward_native_test.nas > build/mth/tensor-backward.nan
      - name: Execute native rank-three backward gradients
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/tensor-backward.nan --steps 15000000 --serial > build/mth/tensor-backward.out 2> build/mth/tensor-backward.err
          cat build/mth/tensor-backward.out
          cat build/mth/tensor-backward.err
          grep -q '^MTH HYPERTENSOR BACKWARD PASS' build/mth/tensor-backward.out
      - name: Assemble native approximate Fiedler fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_fiedler16_native_test.nas > build/mth/fiedler.nan
      - name: Execute graph Fiedler and spectral clustering in NaN16
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/fiedler.nan --steps 15000000 --serial > build/mth/fiedler.out 2> build/mth/fiedler.err
          cat build/mth/fiedler.out
          cat build/mth/fiedler.err
          grep -q '^MTH FIEDLER16 NATIVE PASS' build/mth/fiedler.out
      - name: Assemble masked global attention backward fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_global_focus16_backward_native_test.nas > build/mth/global-backward.nan
      - name: Execute native global attention backward gradients
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/global-backward.nan --steps 15000000 --serial > build/mth/global-backward.out 2> build/mth/global-backward.err
          cat build/mth/global-backward.out
          cat build/mth/global-backward.err
          grep -q '^MTH GLOBAL FOCUS BACKWARD PASS' build/mth/global-backward.out
      - name: Assemble global canonical-pair Hodge incidence fixture
        run: |
          awk -f nan0s/tools/nmk.awk -v CMD=emit mth/tests/mth_global_hodge256_native_test.nas > build/mth/global-hodge.nan
      - name: Execute 256-head B1/B2 Hodge in NaN16
        run: |
          set -o pipefail
          nan0s/aarch64/android/nan_cli --img build/mth/global-hodge.nan --steps 15000000 --serial > build/mth/global-hodge.out 2> build/mth/global-hodge.err
          cat build/mth/global-hodge.out
          cat build/mth/global-hodge.err
          grep -q '^MTH GLOBAL HODGE256 PASS' build/mth/global-hodge.out
      - name: Attach diagnostic output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypertriad-native-failure
          path: |
            build/mth/hypertriad.out
            build/mth/hypertriad.err
            build/mth/global-focus.out
            build/mth/global-focus.err
            build/mth/sheaf-fourier.out
            build/mth/sheaf-fourier.err
            build/mth/motif-spectral.out
            build/mth/motif-spectral.err
            build/mth/connected-focus.out
            build/mth/connected-focus.err
            build/mth/tensor-backward.out
            build/mth/tensor-backward.err
            build/mth/fiedler.out
            build/mth/fiedler.err
            build/mth/global-backward.out
            build/mth/global-backward.err
            build/mth/global-hodge.out
            build/mth/global-hodge.err
          if-no-files-found: ignore
