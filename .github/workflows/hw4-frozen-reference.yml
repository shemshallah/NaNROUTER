name: HW4 WordNet frozen reference — integrity and restore
on:
  push:
    branches: [feat/hw4-wordnet-durable-reference-20261109]
    paths:
      - 'runner_riddle/hw4_reference.py'
      - 'tests/test_hw4_reference.py'
      - '.github/workflows/hw4-frozen-reference.yml'
  pull_request:
    paths:
      - 'runner_riddle/hw4_reference.py'
      - 'tests/test_hw4_reference.py'
      - '.github/workflows/hw4-frozen-reference.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test_and_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run immutable snapshot and restoration tests
        run: python3 -m unittest tests.test_hw4_reference -v
      - name: Build one version-pinned WordNet 3.1 reference from Princeton
        run: |
          mkdir -p /tmp/hw4-wordnet
          curl --fail --location --show-error --silent --retry 3 \
            https://wordnetcode.princeton.edu/wn3.1.dict.tar.gz \
            --output /tmp/hw4-wordnet/wn3.1.dict.tar.gz
          tar -xzf /tmp/hw4-wordnet/wn3.1.dict.tar.gz -C /tmp/hw4-wordnet
          noun="$(find /tmp/hw4-wordnet -type f -name data.noun -print -quit)"
          test -n "$noun"
          sha256sum "$noun"
          python3 -m runner_riddle.hw4_reference install "$noun" /tmp/hw4-wordnet/frozen-reference
          python3 -m runner_riddle.hw4_reference verify /tmp/hw4-wordnet/frozen-reference
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/hw4-wordnet/frozen-reference/CURRENT.json")
          x=json.loads(p.read_text())
          manifest=json.loads((p.parent/x["generation_name"]/"manifest.json").read_text())
          assert manifest["root_bytes"]==8388608
          assert manifest["synsets"]>10000
          assert manifest["relations"]>10000
          print("WORDNET31_FROZEN_HW4_REFERENCE",json.dumps(manifest,sort_keys=True))
          PY
          # Include WordNet's copyright and license terms with the data derivative.
          license="$(find /tmp/hw4-wordnet -type f -name LICENSE -print -quit)"
          if [ -n "$license" ] && [ -s "$license" ]; then
            cp "$license" /tmp/hw4-wordnet/frozen-reference/WORDNET_LICENSE.txt
          else
            curl --fail --show-error --silent --location --retry 3 \
              https://raw.githubusercontent.com/spdx/license-list-data/main/text/WordNet.txt \
              --output /tmp/hw4-wordnet/frozen-reference/WORDNET_LICENSE.txt
          fi
          test -s /tmp/hw4-wordnet/frozen-reference/WORDNET_LICENSE.txt
          tar -C /tmp/hw4-wordnet -czf /tmp/hw4-reference-wordnet31.tar.gz frozen-reference
      - name: Archive immutable reference generation for verified later installation
        uses: actions/upload-artifact@v4
        with:
          name: hw4-wordnet31-digest-verified-reference
          path: /tmp/hw4-reference-wordnet31.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Publish persistent, versioned WordNet reference release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/hw4-wordnet-durable-reference-20261109'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hw4-wordnet31-reference-g1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; will not replace immutable reference asset"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url
          else
            source_sha="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/hw4-wordnet/frozen-reference/generation-00000001/manifest.json")
          print(json.loads(p.read_text())["source_sha256"])
          PY
            )"
            gh release create "$tag" /tmp/hw4-reference-wordnet31.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "HW4 Frozen WordNet 3.1 C(256,2) Reference — Generation 1" \
              --notes "Immutable offline reference, NOT deployed NANNET HW4. Source data.noun SHA256: ${source_sha}. Archive contains 8 MiB matrix, exact SQLite overlay, SHA256 manifest, pointer and WordNet license." \
              --target "$GITHUB_SHA" --latest=false
          fi
