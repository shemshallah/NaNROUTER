name: mirror-l0-l9-matrix
on:
  push:
    paths:
      - 'runner_riddle/address.py'
      - 'runner_riddle/mirror_layer_matrix.py'
      - 'runner_riddle/mirror_point_register.py'
      - 'tests/test_mirror_layer_matrix.py'
      - '.github/workflows/mirror-l0-l9-matrix.yml'
  pull_request:
    paths:
      - 'runner_riddle/address.py'
      - 'runner_riddle/mirror_layer_matrix.py'
      - 'runner_riddle/mirror_point_register.py'
      - 'tests/test_mirror_layer_matrix.py'
      - '.github/workflows/mirror-l0-l9-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix-and-legacy-addresses:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run native-address mapping and sparse relation tests
        run: |
          python -m unittest discover -s tests -p 'test_mirror_layer_matrix.py' -v
          python -m unittest discover -s tests -p 'test_address_v2.py' -v
          python -m unittest discover -s tests -p 'test_mirror_point_register.py' -v
