name: local head role and HERMES mirror parity
on:
  push:
    paths:
      - 'runner_riddle/head_role_contract.py'
      - 'runner_riddle/mirror_point_register.py'
      - 'tests/test_head_role_contract.py'
      - 'tests/cross_repo_head_roles.py'
      - '.github/workflows/head-role-contract.yml'
  pull_request:
    paths:
      - 'runner_riddle/head_role_contract.py'
      - 'runner_riddle/mirror_point_register.py'
      - 'tests/test_head_role_contract.py'
      - 'tests/cross_repo_head_roles.py'
      - '.github/workflows/head-role-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-universe-head-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNLMind_HERMES
          ref: main
          path: hermes
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify local 256/255/250 palindrome head role contract
        run: |
          python -m unittest discover -s tests -p 'test_head_role_contract.py' -v
          python -m unittest discover -s tests -p 'test_mirror_point_register.py' -v
      - name: Independently verify all HERMES mirror heads and 32640 pairs
        env:
          PYTHONPATH: .:hermes
        run: python tests/cross_repo_head_roles.py
