name: native-graph-claim-probe

on:
  pull_request:
    paths:
      - 'mth/nan16/mth_graph_claim_probe.nas'
      - 'mth/tests/mth_graph_claim_probe_test.nas'
      - '.github/workflows/native-graph-claim-probe.yml'
  push:
    branches: [main]
    paths:
      - 'mth/nan16/mth_graph_claim_probe.nas'
      - 'mth/tests/mth_graph_claim_probe_test.nas'
      - '.github/workflows/native-graph-claim-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-claim-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NaNROUTER
        uses: actions/checkout@v4
      - name: Checkout pinned canonical NaN0S source assembler and VM
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: 7f250a11bdb7845eae06ffb50df202187543ea5e
          path: nan0s
      - name: Build native NaN16 CLI harness
        run: make -s -C nan0s/aarch64/android nan_cli
      - name: Assemble with NaN16 source toolchain
        run: |
          mkdir -p build/mth
          awk -f nan0s/tools/nmk.awk -v CMD=emit \
            mth/tests/mth_graph_claim_probe_test.nas \
            > build/mth/graph-claim-probe.nan
      - name: Execute in native NaN16 guest and assert all cases
        run: |
          nan0s/aarch64/android/nan_cli \
            --img build/mth/graph-claim-probe.nan \
            --steps 2000000 --serial \
            > build/mth/graph-claim-probe.out \
            2> build/mth/graph-claim-probe.err
          cat build/mth/graph-claim-probe.out
          cat build/mth/graph-claim-probe.err
          grep -q '^MTH GRAPH CLAIM PROBE PASS' build/mth/graph-claim-probe.out
          ! grep -q 'MTH GRAPH CLAIM PROBE FAIL' build/mth/graph-claim-probe.out
