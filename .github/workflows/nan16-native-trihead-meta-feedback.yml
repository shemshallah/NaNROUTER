name: nan16-native-trihead-meta-feedback

on:
  push:
    branches: [mth-hypertensor-simplicial-native-20261110]
    paths:
      - "mth/nan16/mth_trihead_meta_feedback_f32.nas"
      - "mth/nan16/mth_hypertensor256_mirror_arena_map.nas"
      - "mth/tests/mth_trihead_meta_feedback_native_test.nas"
      - ".github/workflows/nan16-native-trihead-meta-feedback.yml"
  pull_request:
    paths:
      - "mth/nan16/mth_trihead_meta_feedback_f32.nas"
      - "mth/nan16/mth_hypertensor256_mirror_arena_map.nas"
      - "mth/tests/mth_trihead_meta_feedback_native_test.nas"
      - ".github/workflows/nan16-native-trihead-meta-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-authorized-triheads-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NaN0S native VM
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: fe636177027a1ede3f19939f7627e660e7bef5f3
          path: nan0s
      - name: Assemble and execute trihead feedback entirely in NaN16
        run: |
          set -euo pipefail
          make -s -C nan0s/aarch64/android nan_cli
          mkdir -p build/mth
          awk -f nan0s/tools/nmk.awk -v CMD=emit \
            mth/tests/mth_trihead_meta_feedback_native_test.nas \
            > build/mth/trihead-meta.nan
          nan0s/aarch64/android/nan_cli \
            --img build/mth/trihead-meta.nan \
            --steps 15000000 --serial \
            > build/mth/trihead-meta.out 2> build/mth/trihead-meta.err
          cat build/mth/trihead-meta.out
          cat build/mth/trihead-meta.err
          grep -qx 'MTH TRIHEAD META FEEDBACK PASS' build/mth/trihead-meta.out
      - name: Preserve native trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trihead-meta-feedback-native
          path: |
            build/mth/trihead-meta.out
            build/mth/trihead-meta.err
          if-no-files-found: ignore
          retention-days: 14
