name: nan16-native-hypertensor256-mirror-arena

on:
  push:
    branches: [mth-hypertensor-simplicial-native-20261110]
    paths:
      - "mth/nan16/mth_hypertensor256_mirror_arena_map.nas"
      - "mth/nan16/mth_hypertensor256_mirror_dual_map.nas"
      - "mth/tests/mth_hypertensor256_mirror_arena_native_test.nas"
      - "mth/tests/mth_hypertensor256_mirror_dual_native_test.nas"
      - "scripts/init_full128_mirror_tensor_storage.py"
      - "tests/test_full128_mirror_tensor_storage.py"
      - ".github/workflows/nan16-native-hypertensor256-mirror-arena.yml"
  pull_request:
    paths:
      - "mth/nan16/mth_hypertensor256_mirror_arena_map.nas"
      - "mth/nan16/mth_hypertensor256_mirror_dual_map.nas"
      - "mth/tests/mth_hypertensor256_mirror_arena_native_test.nas"
      - "mth/tests/mth_hypertensor256_mirror_dual_native_test.nas"
      - "scripts/init_full128_mirror_tensor_storage.py"
      - "tests/test_full128_mirror_tensor_storage.py"
      - ".github/workflows/nan16-native-hypertensor256-mirror-arena.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arena-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout NaNROUTER
        uses: actions/checkout@v4
      - name: Checkout pinned canonical NaN0S VM
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: fe636177027a1ede3f19939f7627e660e7bef5f3
          path: nan0s
      - name: Build native NaN16 CLI and assemble guest
        run: |
          set -euo pipefail
          make -s -C nan0s/aarch64/android nan_cli
          mkdir -p build/mth
          awk -f nan0s/tools/nmk.awk -v CMD=emit \
            mth/tests/mth_hypertensor256_mirror_arena_native_test.nas \
            > build/mth/hypertensor256-mirror-arena.nan
      - name: Check canonical mirror map and void head 255 in NaN16
        run: |
          set -euo pipefail
          nan0s/aarch64/android/nan_cli \
            --img build/mth/hypertensor256-mirror-arena.nan \
            --steps 30000000 --serial \
            > build/mth/hypertensor256-mirror-arena.out \
            2> build/mth/hypertensor256-mirror-arena.err
          cat build/mth/hypertensor256-mirror-arena.out
          cat build/mth/hypertensor256-mirror-arena.err
          grep -qx 'MTH HYPERTENSOR256 MIRROR ARENA PASS' \
            build/mth/hypertensor256-mirror-arena.out
      - name: Check FULL 128 MiB dual tensors in native NaN16
        run: |
          set -euo pipefail
          awk -f nan0s/tools/nmk.awk -v CMD=emit \
            mth/tests/mth_hypertensor256_mirror_dual_native_test.nas \
            > build/mth/hypertensor256-mirror-dual.nan
          nan0s/aarch64/android/nan_cli \
            --img build/mth/hypertensor256-mirror-dual.nan \
            --steps 15000000 --serial \
            > build/mth/hypertensor256-mirror-dual.out \
            2> build/mth/hypertensor256-mirror-dual.err
          cat build/mth/hypertensor256-mirror-dual.out
          cat build/mth/hypertensor256-mirror-dual.err
          grep -qx 'MTH FULL 128M MIRROR DUAL BANK PASS' \
            build/mth/hypertensor256-mirror-dual.out
      - name: Provision and verify the REAL 128 MiB external tensor backing
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_full128_mirror_tensor_storage.py' -v
          python3 scripts/init_full128_mirror_tensor_storage.py \
            --output build/mth/full128-mirror.f32le \
            --manifest build/mth/full128-mirror.json
          python3 scripts/init_full128_mirror_tensor_storage.py \
            --output build/mth/full128-mirror.f32le \
            --manifest build/mth/full128-mirror.json --verify
          test "$(stat -c %s build/mth/full128-mirror.f32le)" = 134217728
      - name: Preserve guest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypertensor256-mirror-arena-native
          path: |
            build/mth/hypertensor256-mirror-arena.out
            build/mth/hypertensor256-mirror-arena.err
            build/mth/hypertensor256-mirror-dual.out
            build/mth/hypertensor256-mirror-dual.err
            build/mth/full128-mirror.json
          if-no-files-found: ignore
          retention-days: 14
