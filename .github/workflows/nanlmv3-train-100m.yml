name: nanlmv3-train-100m

# Builds the deterministic 100M-character corpus, trains the 32k BPE, then
# trains the ~10M mixer with a causal attention trunk and geometry-routed
# memory.  This is the Stage 1 runner.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Optimizer steps"
        required: true
        default: "5000"
      model_mb:
        description: "Model-training sample (MB)"
        required: true
        default: "20"
      bpe_mb:
        description: "BPE-training sample (MB)"
        required: true
        default: "50"
      release_tag:
        description: "Corpus release tag"
        required: true
        default: "corpora-sentences-0001"

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch, tokenizers, zstd
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: Fetch and verify the published corpus batch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p build/release build/corpus
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.tar.zst' --pattern '*.SHA256SUMS' --dir build/release
          (cd build/release && sha256sum -c ./*.SHA256SUMS)
          tar --zstd -xf build/release/*.tar.zst -C build/corpus
          find build/corpus -type f -name '*.txt' | wc -l
          du -sh build/corpus

      - name: Build the 100M-character corpus
        run: |
          set -euo pipefail
          python nanlmv3/prepare_corpus.py \
            --source build/corpus \
            --bytes 100000000 \
            --output build/corpus_100m.txt \
            --manifest build/corpus_100m.json
          test -s build/corpus_100m.txt
          wc -c build/corpus_100m.txt

      - name: Build chunk-sampled BPE and model corpora
        env:
          BPE_MB: ${{ inputs.bpe_mb }}
          MODEL_MB: ${{ inputs.model_mb }}
        run: |
          set -euo pipefail
          python nanlmv3/sample_corpus.py \
            --source build/corpus_100m.txt \
            --output build/bpe_sample.txt \
            --bytes $((BPE_MB * 1000000)) \
            --chunks 50 --val-chunks 0
          python nanlmv3/sample_corpus.py \
            --source build/corpus_100m.txt \
            --output build/model_sample.txt \
            --bytes $((MODEL_MB * 1000000)) \
            --chunks 20 --val-chunks 2 \
            --manifest build/model_sample.json
          test -s build/bpe_sample.txt
          test -s build/model_sample.txt
          wc -c build/bpe_sample.txt build/model_sample.txt build/model_sample.json

      - name: Train 32k BPE
        run: |
          set -euo pipefail
          python nanlmv3/train_bpe.py \
            --corpus build/bpe_sample.txt \
            --vocab-size 32000 \
            --output build/bpe32k.json \
            --meta build/bpe32k_meta.json
          python - <<'PY'
          import json
          from tokenizers import Tokenizer
          tok = Tokenizer.from_file("build/bpe32k.json")
          print("vocab_size", tok.get_vocab_size())
          print("sample", tok.encode("the quick brown fox jumps over the lazy dog.").tokens[:20])
          assert tok.get_vocab_size() >= 32000
          PY

      - name: Train 10M mixer with causal trunk and routed memory
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          python nanlmv3/frontier_model.py \
            --mode hybrid \
            --corpus build/model_sample.txt \
            --tokenizer bpe \
            --bpe-model build/bpe32k.json \
            --params 10m \
            --trunk-layers 2 \
            --trunk-heads 4 \
            --trunk-ff 896 \
            --steps "$STEPS" \
            --batch-size 8 \
            --ctx 64 \
            --orders 4 \
            --train-fraction 0.9 \
            --eval-every 1000 \
            --eval-batches 4 \
            --prev-weight 0.1 \
            --recluster-every 1000 \
            --threads 4 \
            --summary build/train_summary.json \
            --checkpoint build/train.pt \
            --log build/train.jsonl
          python - <<'PY'
          import json
          d = json.load(open("build/train_summary.json"))
          print(json.dumps(d, indent=2, sort_keys=True))
          assert d["params"] >= 9_000_000
          assert d["vocab_size"] == 32000
          assert d["tokenizer"] == "bpe"
          assert d["config"]["trunk_layers"] == 2
          assert d["config"]["use_order_gate"] is True
          PY

      - name: Upload corpus manifest and training evidence
        uses: actions/upload-artifact@v4
        with:
          name: nanlmv3-100m-bpe-10m
          path: |
            build/corpus_100m.json
            build/model_sample.json
            build/bpe32k.json
            build/bpe32k_meta.json
            build/train_summary.json
            build/train.jsonl
            build/train.pt
          if-no-files-found: error
          retention-days: 30
