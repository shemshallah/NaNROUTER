name: manifest-contract
on:
  push:
    branches: [main, bootstrap-logic-routing-riddle, runner-riddle-route-engine, bs0-koyeb-control-service, master-cache-association-atlas, bs0-feedback-loop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
