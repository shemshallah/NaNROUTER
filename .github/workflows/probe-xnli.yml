name: Probe XNLI CSV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and inspect the first XNLI rows
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import io
          import os
          import urllib.request
          import zipfile

          token = os.environ["KAGGLE_API_TOKEN"]
          url = "https://www.kaggle.com/api/v1/datasets/download/thedevastator/xnli-multilingual-nli-dataset"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
          with urllib.request.urlopen(request, timeout=300) as response:
              data = response.read()
          print("zip bytes", len(data))
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              print("members", archive.namelist()[:10])
              with archive.open("all_languages_train.csv") as handle:
                  raw = handle.read(8000)
          print("raw prefix repr", repr(raw[:2500]))
          text = io.TextIOWrapper(io.BytesIO(raw), encoding="utf-8", errors="replace", newline="")
          reader = csv.DictReader(text)
          print("fields", reader.fieldnames)
          row = next(reader)
          for key, value in row.items():
              print(key, "=", repr(value)[:1200])
          PY
