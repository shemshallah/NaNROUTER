name: nan16-native-real48m-wholeword-trace

on:
  push:
    branches: [mth-hypertensor-simplicial-native-20261110]
    paths:
      - "tests/fixtures/r28_frozen48m_wholeword_pairs.b64"
      - "scripts/build_native_wholeword_nll_fixture.py"
      - "scripts/apply_native_wholeword_journal_transport.py"
      - "scripts/init_full128_mirror_tensor_storage.py"
      - "mth/nan16/mth_trihead_wholeword_nll_feedback_f32.nas"
      - ".github/workflows/nan16-native-real48m-wholeword-trace.yml"
  pull_request:
    paths:
      - "tests/fixtures/r28_frozen48m_wholeword_pairs.b64"
      - "scripts/build_native_wholeword_nll_fixture.py"
      - "mth/nan16/mth_trihead_wholeword_nll_feedback_f32.nas"
      - ".github/workflows/nan16-native-real48m-wholeword-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-frozen-48m-word:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: fe636177027a1ede3f19939f7627e660e7bef5f3
          path: nan0s
      - name: Verify immutable derived original 48M whole-word probability trace
        run: |
          set -euo pipefail
          mkdir -p build/real-48m
          python3 - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          encoded=Path("tests/fixtures/r28_frozen48m_wholeword_pairs.b64").read_text().strip()
          raw=zlib.decompress(base64.urlsafe_b64decode(encoded))
          dev,test=raw.split(b"\0")
          expected={
            "dev":"1965d42b41ee547feea6f76fae23747c83aac07c4ce908098c0186ddbd9b4217",
            "test":"ed15c6b43bf1b3988b1e9cdc8bd5a5b25f1c01d73f94188998caa285aceff22d",
          }
          for name,buf in (("dev",dev),("test",test)):
            digest=hashlib.sha256(buf).hexdigest()
            assert digest==expected[name],f"{name} source trace changed"
            assert buf.startswith(b"FROZEN_48M_WHOLEWORD_PROB_V1 128\n")
            Path("build/real-48m/"+name+".trace").write_bytes(buf)
            print("FROZEN_R25_REAL_WORD_TRACE",name,"rows",128,"sha256",digest)
          PY
      - name: Compile native NaN16 and source-authentic R25 full-word NLL guest
        run: |
          set -euo pipefail
          make -s -C nan0s/aarch64/android nan_cli
          python3 scripts/build_native_wholeword_nll_fixture.py \
            --dev build/real-48m/dev.trace \
            --test build/real-48m/test.trace \
            --output mth/tests/mth_r25_original_word_generated.nas \
            --manifest build/real-48m/manifest.json \
            --h 19 --a 7 --b 4 --theta -0.125
          awk -f nan0s/tools/nmk.awk -v CMD=emit \
            mth/tests/mth_r25_original_word_generated.nas \
            > build/real-48m/native-original-r25.nan
      - name: Evaluate frozen original 48M whole-word predictions IN NATIVE NaN16
        run: |
          set -euo pipefail
          nan0s/aarch64/android/nan_cli \
            --img build/real-48m/native-original-r25.nan \
            --steps 240000000 --serial \
            > build/real-48m/native.out 2> build/real-48m/native.err
          cat build/real-48m/native.out
          cat build/real-48m/native.err
          grep -qx 'MTH ORIGINAL 48M WHOLEWORD NLL FEEDBACK PASS' \
            build/real-48m/native.out
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines=Path("build/real-48m/native.out").read_text().splitlines()
          def unpack(label):
            rows=[line for line in lines if line.startswith(label+" ")]
            assert len(rows)==1,rows
            return tuple(map(int,rows[0].split()[1:]))
          dev=unpack("WHOLEWORD_DEV_NLL_MILLI")
          test=unpack("WHOLEWORD_TEST_NLL_MILLI")
          assert dev[2]==1 and dev[1]<dev[0],dev
          # The heldout audit may disagree. It NEVER has authority to admit.
          assert test[2] in (0,1),test
          result={
            "native_real_48m_wholeword_dev_nll_milli":dev,
            "native_real_48m_wholeword_test_nll_milli":test,
            "frozen_hybrid_48m":True,
            "source":"original R27 archived R25 decoder, no raw text/weights in git",
            "sampled_positions_dev":128,"sampled_positions_test":128,
            "test_used_for_admission":False,"root_updated":False,
            "active_tensor_promoted":False,
            "notes":"Subsampled historical/context-exposed splits; integration only, no independent generalization claim",
          }
          print("NATIVE_REAL48M_FULLWORD_LOSS",json.dumps(result,sort_keys=True))
          Path("build/real-48m/audit.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
      - name: Native-approved original 48M candidate -> 128 MiB mirror bank1 ONLY
        run: |
          set -euo pipefail
          python3 scripts/init_full128_mirror_tensor_storage.py \
            --output build/real-48m/tensor128.bin \
            --manifest build/real-48m/tensor128.manifest.json
          python3 scripts/apply_native_wholeword_journal_transport.py \
            --arena build/real-48m/tensor128.bin \
            --arena-manifest build/real-48m/tensor128.manifest.json \
            --native-log build/real-48m/native.out \
            --dev-trace build/real-48m/dev.trace \
            --test-trace build/real-48m/test.trace \
            --fixture-manifest build/real-48m/manifest.json \
            | tee build/real-48m/candidate-transport.json
          python3 scripts/init_full128_mirror_tensor_storage.py \
            --output build/real-48m/tensor128.bin \
            --manifest build/real-48m/tensor128.manifest.json --verify
          python3 - <<'PY'
          import struct,sys,json
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from init_full128_mirror_tensor_storage import BANK_BYTES, TOTAL_BYTES, physical_offset
          p=Path('build/real-48m/tensor128.bin')
          m=json.loads(Path('build/real-48m/tensor128.manifest.json').read_text())
          offset=physical_offset(0,19,7,4)[0]
          assert offset==0x004C23C4
          assert p.stat().st_size==TOTAL_BYTES==134217728
          with p.open('rb') as f:
            f.seek(offset)
            assert f.read(4)==b'\x00'*4
            f.seek(BANK_BYTES+offset)
            assert f.read(4)==struct.pack('<I',0xBE000000)
          assert m['candidate_generation']==1
          assert m['promotion_implemented'] is False
          print('ORIGINAL48M_FULLWORD_NATIVE_CANDIDATE_128M_ONLY_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-genuine-frozen48m-wholeword-audit
          path: |
            build/real-48m/native.out
            build/real-48m/native.err
            build/real-48m/manifest.json
            build/real-48m/audit.json
            build/real-48m/candidate-transport.json
            build/real-48m/tensor128.manifest.json
          if-no-files-found: ignore
          retention-days: 21
