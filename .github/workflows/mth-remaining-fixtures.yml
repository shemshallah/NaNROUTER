name: MTH remaining native fixture verification

on:
  pull_request:
    paths:
      - "mth/nan16/**"
      - "mth/tests/**"
      - "spec/wave-capabilities.json"
      - "tools/run_mth_fixtures.py"
      - ".github/workflows/mth-remaining-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "mth/nan16/**"
      - "mth/tests/**"
      - "spec/wave-capabilities.json"
      - "tools/run_mth_fixtures.py"
      - ".github/workflows/mth-remaining-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-remaining-mth-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: fe636177027a1ede3f19939f7627e660e7bef5f3
          path: nan0s
      - name: Build pinned NaN0S native CLI
        run: make -s -C nan0s/aarch64/android nan_cli
      - name: Execute the MTH native fixture promotion set
        run: |
          set -euo pipefail
          python tools/run_mth_fixtures.py --nan0s-root nan0s \
          --only graph_degree \
          --only graph_pattern \
          --only graph_filter \
          --only bool2 \
          --only bitwise \
          --only integer \
          --only shift \
          --only multiply \
          --only divide \
          --only stage0 \
          --only double_endian \
          --only vector_add \
          --only preflight_typed \
          --only native_dispatch \
          --only vector_add256_f32 \
          --only vector_sub256_f32 \
          --only vector_mean256_f32 \
          --only vector_abs256_f32 \
          --only vector_relu256_f32 \
          --only vector_mask256_f32 \
          --only vector_weighted_sum256_f32 \
          --only vector_softmax256_f32 \
          --only vector_sum256_f32 \
          --only vector_max256_f32 \
          --only vector_min256_f32 \
          --only vector_head_concat256_f32 \
          --only pair_full_grid_driver \
          --only vector_sqrt256_f32 \
          --only vector_rsqrt256_f32 \
          --only vector_exp256_f32 \
          --only vector_log256_f32 \
          --only vector_logsumexp256_f32 \
          --only sequence_step_u32 \
          --only vector_sigmoid256_f32 \
          --only vector_tanh256_f32 \
          --only mirror_pair_map \
          --only mirror_cycle_flux \
          --only mirror_root_step \
          --only hyperedge_strength_step \
          --only hyperedge_strength_batch \
          --only mirror_bounds_check \
          --only mirror_gauge_check \
          --only relation_operator_apply \
          --only wordnet_concept_map \
          --only mirror_block_checksum \
          --only hyperedge_incidence_walk \
          --only mirror_head_record_io \
          --only hyperedge_path_score \
          --only mirror_hodge_projection \
          --only mirror_pair_lane_io \
          --only retrieval_top1 \
          --only byte_fallback_argmax \
          --only byte_copy24 \
          --only copy_gate \
          --only definition_slot_io \
          --only gauge_triangle_recover \
          --only mirror_slot_map \
          --only relation_writer_class \
          --only trig_sincos \
          --only trig_rotate \
          --only mirror_cycle_train \
          --only ring_angular_map \
          --only trig_twiddle256 \
          --only cycle_phase_gate \
          --only cycle_retain \
          --only cycle_contradiction \
          --only attention_mix16 \
          --only logsoftmax256 \
          --only cross_entropy256 \
          --only evidence_cycle_state \
          --only pair_knockout \
          --only attention_project16 \
          --only attention_head16 \
          --only attention_mask16 \
          --only memory_condition16 \
          --only field_mix255x16 \
          --only field_mix255x16_backward \
          --only field_gate255 \
          --only assoc3_reserve \
          --only byte_memory_mix \
          --only graph_laplacian_csr \
          --only rss_contract \
          --only matrix_transpose256 \
          --only vector_argmax256_f32 \
          --only vector_argmin256_f32 \
          --only vector_scale256_f32 \
          --only matrix_diagonal256 \
          --only matrix_add256 \
          --only vector_normalize256_f32 \
          --only vector_prefix_sum256_u32 \
          --only prng_xorshift64 \
          --only universe_map
